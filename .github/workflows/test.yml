name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # The app builds with Xcode 26's SDK.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodebuild -version
      # Without scripts/signing.env the build is ad-hoc signed.
      - run: scripts/build.sh --test
