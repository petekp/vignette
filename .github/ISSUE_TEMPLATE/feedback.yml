name: Share feedback or an idea
description: Something that felt confusing, slow, or missing, or something you'd like Vignette to do.
labels: [enhancement]
body:
  - type: textarea
    id: feedback
    attributes:
      label: What's on your mind?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What were you trying to do?
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or a recording
      description: Drop images or a video here. A drawing on one is welcome.
