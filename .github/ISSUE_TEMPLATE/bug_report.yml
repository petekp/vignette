name: Send feedback
description: A problem, a question, or an idea.
body:
  - type: textarea
    id: details
    attributes:
      label: What would you like to share?
      description: Drop in screenshots, a recording, or Vignette's log. Report a Problem… in Vignette's menu shows the log in Finder. The log lists your screenshots' file names and folders.
    validations:
      required: true
