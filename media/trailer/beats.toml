# The trailer, as data. Edit this file for wording, timing, framing and the marks, then run
# `trailer.py cut` to render it again from the last take. Changing `app`, `stage`, `ask`, `point`
# or `rhythm` needs a new take (`trailer.py record`).
#
# The cut is the spans of the take it keeps, played at the take's speed, with beats laid over them:
# a caption each, and the camera's moves. The camera and the captions carry on across spans. After
# the last span comes the end card.
#
# Times are written against the events drive.py logs during a take: "send.press",
# "send.press+0.5" or "send.press-1.0", in seconds. `trailer.py events` lists a take's events.
# Places on the page are in its CSS pixels, 904 x 565, whatever the screen. Places on the desktop
# are in points, from the screen's top left.

[output]
width = 1600
height = 1000
fps = 60
# The poster is the frame of the cut that shows this moment of the take: the drawing, finished.
poster = { at = "marks.done+0.5" }
# The last `loop` seconds dissolve back into the first frame, and the first caption comes back with
# it, so the trailer loops without a jump. 0 ends on the last frame.
loop = 0.8

# One tempo for the whole film. The hand presses, clicks and types on its beats. The cut starts and
# ends each span on a beat, makes every dissolve a whole number of half beats, and puts every
# caption change and camera move on a half beat, so everything the viewer sees keeps that time.
[rhythm]
beat = 0.5

[caption]
# Pixels at 1600 wide, as in the storyboard.
size = 34
key_size = 22
x = 44
y = 40
# How long a key cap stays lit after its key is pressed.
lit = 0.45
# How long one caption takes to turn into the next.
change = 0.45

[camera]
# While the camera holds on something, it creeps in by this much of its width a second, up to
# `drift_most`, so a hold is never a frozen frame.
drift = 0.01
drift_most = 0.03

# The end card: the app icon, the wordmark written on, and two lines under it. `exit` is when its
# parts start to leave, and `length` includes the loop's dissolve back to the first frame.
[outro]
length = 5.5
exit = 4.0
icon = "outro/icon.png"
wordmark = "outro/wordmark.png"
tagline = "The modern Mac screenshot tool for the agentic age."
footer = "Free for macOS 14 or later  ·  vignette.pete.design"

# The stage copy's settings.json. Anything left out takes the app's default. Copy on capture is
# off: the pasteboard is your own, and Claude Code would announce the image in its footer.
[app]
settings = { setup = "done", copyOnCapture = false, agentSkill = "off", hideMenuBarIcon = true, launchAtLogin = false, recentHotkey = "ctrl+opt+cmd+9", debug = false }

# The desktop: a wallpaper, Claude Code in a terminal on the left, and Postcard in Chrome on the
# right.
[stage]
# Where the windows go, in points: x, y, w, h. The browser's height is then fitted so the page
# shows at 16:10.
terminal = [16, 54, 560, 912]
browser = [592, 54, 904, 660]
# The page's size in CSS pixels, which the places in `ask` and `point` are in.
units = [904, 565]
# Options for the terminal, as Ghostty takes them.
terminal_args = []
# The app's dev server.
port = 5391
# Where the pointer waits between moves.
rest = [1180, 880]
# The hand's variation in how it moves the pointer.
seed = 7

# The terminal runs Claude Code with the stage copy's plugin. The prompt is an earlier exchange
# about the app, answered before the take starts, so the terminal is not empty. Claude Code titles
# the session from it, and Send shows that title. Vignette reads only that title, not a name given
# with `claude -n`, so the session is not named.
[stage.session]
prompt = "Walk me through how the itinerary page is built."
# Seconds from Claude Code starting to the take starting. Its notices over the input, such as the
# account's usage, were gone within 15 s (2026-09-28).
settle = 20
# More options for claude, such as ["--model", "sonnet"].
args = []

# Your marks on the itinerary. An arrow from the map's second stop to the Chianti day, with its
# note beyond the arrow's tail, beside the stop. Then a box around the Oct 14 day, with its note
# under the box. Both notes must fit on one line: the editor's text is 24 pt.
[ask]
file = "Itinerary.png"
link = { from = [664, 161], to = [424, 334], note = "number the days" }
box = { box = [598, 227, 287, 288], note = "make this pop, options?" }
# A click here, with nothing on it, clears the selection before the drawing is sent.
empty = [470, 140]
# Typing speed, in characters a second.
typing = 14

# Your answer on Claude's three versions: a box around the one you pick, `pick` counted from 0, and
# an arrow from the Highlight flag on another into it, ending `tip` from the picked card's top left.
[point]
pick = 2
pad = 7
note = "this one, with that flag"
tip = [34, 30]

# The spans of the take the cut keeps, in order. Inside a span the take plays at its own speed.
# A span after the first dissolves in over the last `dissolve` seconds of the one before, so where
# the cut skips ahead the picture blends instead of jumping. Start and end a span where the pointer
# is still, or its two positions show during the dissolve.

# The desktop, the capture, a click into the editor, both marks, Send, the card going home while
# the drawing lands in Claude Code, and Claude reading it.
[[span]]
from = "capture.crosshair-1.0"
to = "claude.working+1.5"

# Claude's working time is the dissolve. The page has its day numbers, and Claude's options arrive
# as a card; a click opens them, you answer, and Reply sends it back. The take waits for Claude's
# turn to end before Reply, which is where a span would break if Claude were still busy.
[[span]]
from = "push-1.0"
to = "reply.working+1.5"
dissolve = 0.5

# Claude builds the version you picked. The page changes a file at a time while it works, so the
# dissolve lands after the last change, on the finished page.
[[span]]
from = "built.shown+0.5"
to = "built.shown+4.5"
dissolve = 0.5

# The beats, in the order the cut plays them. A beat's caption comes up at `from` and turns into
# the next beat's at that one's `from`; `press` lights its key caps. `camera` is a list of moves:
# at `at` the camera starts toward `rect` on a spring that settles over `ease` seconds, from
# wherever it is and at whatever speed it has. A time in a stretch the cut skips takes effect where
# the cut goes on. A rect is `desktop`, a name drive.py records, a list of names for the rect around
# all of them, or [x, y, w] in points, and `pad` widens it by that fraction of its width on every
# side. The recorded rects are `game` (the page in the browser), `terminal`, `capture`, `card` (a
# thumbnail), `editor` (the editor and its toolbar), `link`, `ask` and `pick` (a mark with its note)
# and `pointed` (every mark on Claude's picture). Every rect is made 16:10 around its centre, at
# least 800 points wide so no pixel is enlarged (`least` lowers that), and kept on the desktop.
#
# Every move settles over 2 s, or 1.5 s when it pulls back to the desktop at a key press, and
# nothing moves again until it has held for at least a second.

[[beat]]
id = "capture"
caption = "Take a screenshot"
keys = ["⌘", "⇧", "4"]
press = "capture.crosshair"
from = "open"
camera = [{ at = "from", rect = "desktop" }]

[[beat]]
id = "click"
caption = "Click to draw on it"
from = "thumb.shown+0.5"
camera = [{ at = "editor.landed", rect = "editor", pad = 0.02, ease = 2.0 }]

[[beat]]
id = "ask"
caption = "Explain what you want, visually"
from = "link.press-1.0"

[[beat]]
id = "send"
caption = "Send it over"
keys = ["⌘", "↩"]
press = "send.press"
from = "send.press-1.0"
camera = [{ at = "send.press", rect = "desktop", ease = 1.5 }]

[[beat]]
id = "answer"
caption = "Your agent can show you things, too"
from = "push-1.0"
camera = [{ at = "editor2.landed", rect = "editor", pad = 0.02, ease = 2.0 }]

[[beat]]
id = "point"
caption = "Mark it up and send it back"
keys = ["↩"]
press = "reply.press"
from = "pick.press-1.0"
camera = [{ at = "reply.press", rect = "desktop", ease = 1.5 }]

[[beat]]
id = "built"
caption = "Claude builds it"
from = "built.shown-1.5"
camera = [{ at = "built.shown-2.0", rect = "game", pad = 0.02, ease = 2.0 }]
