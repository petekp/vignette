<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mew</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0509; overflow: hidden; }
  #game, #game svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="game"></div>
<script type="module">
import * as levels from './levels.js';
import layout from './level4.json' with { type: 'json' };
const params = new URLSearchParams(location.search);
const n = params.get('level') || '4';
const options = { fixed: params.get('fixed') === '1', showHud: params.get('hud') === '1' };
document.getElementById('game').innerHTML = n === '4' ? levels.level4(layout, options) : levels[`level${n}`](options);
</script>
</body>
</html>
