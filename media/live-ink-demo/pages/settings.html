<!doctype html>
<html><head><meta charset="utf-8"><title>Notifications · Juniper workspace</title>
<style>
  body { font: 15px/1.45 -apple-system, sans-serif; color: #1d1d1f; background: #f5f5f7; margin: 0; }
  .pane { background: #fff; margin: 24px; padding: 24px 28px; border-radius: 12px; box-shadow: 0 1px 3px #0002; }
  h1 { font-size: 20px; margin: 0 0 4px; } .muted { color: #6e6e73; font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid #f0f0f2; }
  .row input { width: 16px; height: 16px; } .row .hint { color: #6e6e73; font-size: 13px; margin-left: auto; }
  select { font-size: 14px; }
  .buttons { display: flex; gap: 10px; margin-top: 20px; }
  button { font: 14px -apple-system, sans-serif; padding: 7px 16px; border-radius: 8px; border: 1px solid #d2d2d7; background: #fff; }
  button.primary { background: #0071e3; border-color: #0071e3; color: #fff; }
</style></head>
<body><div class="pane">
  <h1>Notifications</h1>
  <div class="muted">Juniper workspace · your account</div>
  <div class="row"><input type="checkbox" id="m" checked><label for="m">Mentions and replies</label><span class="hint">Right away</span></div>
  <div class="row"><input type="checkbox" id="w"><label for="w">Weekly summary email</label><span class="hint">Every week</span></div>
  <div class="row"><input type="checkbox" id="p"><label for="p">Product news</label><span class="hint">Now and then</span></div>
  <div class="row"><label for="d">Summary day</label><select id="d"><option>Monday</option><option>Friday</option></select></div>
  <div class="buttons"><button>Discard</button><button class="primary">Save changes</button></div>
</div></body></html>
