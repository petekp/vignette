# To fork: change `name`, the app target and scheme keys that repeat it, both
# PRODUCT_BUNDLE_IDENTIFIER values, and the URL scheme below.
# The log name, status item, Application Support folder, and hotkey registration follow the
# bundle at runtime (Sources/Identity.swift); build.sh and run.sh read `name` for the scheme.
name: Shotnote
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  Shotnote:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: web/dist
        type: folder
        buildPhase: resources
      # tldraw's license requires a verbatim copy in any distribution; ship both licenses in the bundle.
      - path: LICENSE
        buildPhase: resources
      - path: LICENSE-tldraw.md
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ShotnoteBuild: $(SHOTNOTE_BUILD)
        LSUIElement: true
        NSHighResolutionCapable: true
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [shotnote]
    settings:
      base:
        SWIFT_VERSION: "5.10"
        PRODUCT_BUNDLE_IDENTIFIER: com.petepetrash.shotnote
        # build.sh overrides these from git; the defaults are for a build straight from Xcode.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "0"
        SHOTNOTE_BUILD: "local"
        # A real identity keeps the signature stable across builds, so Accessibility trust survives
        # a rebuild. Ad-hoc ("-") signs each build differently and macOS drops the grant.
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: U8GTZZSBDM
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: false
        ENABLE_APP_SANDBOX: false
  ShotnoteTests:
    type: bundle.unit-test
    platform: macOS
    # Compiles the app sources into the test bundle instead of loading the app as a test host,
    # so a test run never launches a second Shotnote against the real settings and watch folder.
    sources:
      - path: Tests
      - path: Sources
        excludes: [AppDelegate.swift]
    settings:
      base:
        SWIFT_VERSION: "5.10"
        PRODUCT_BUNDLE_IDENTIFIER: com.petepetrash.shotnote.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
schemes:
  Shotnote:
    build:
      targets:
        Shotnote: all
        ShotnoteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [ShotnoteTests]
