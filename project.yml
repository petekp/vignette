# To fork: change `name`, the app target and scheme keys that repeat it, both
# PRODUCT_BUNDLE_IDENTIFIER values, and the URL scheme below.
# The log name, status item, Application Support folder, and hotkey registration follow the
# bundle at runtime (Sources/Identity.swift); build.sh and run.sh read `name` for the scheme.
name: Vignette
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  Vignette:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: web/dist
        type: folder
        buildPhase: resources
      # tldraw's license requires a verbatim copy in any distribution; ship both licenses in the bundle.
      - path: LICENSE
        buildPhase: resources
      - path: LICENSE-tldraw.md
        buildPhase: resources
      # The agent skill the app offers to install; SkillInstaller copies this folder out.
      - path: skills/vignette
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        VignetteBuild: $(VIGNETTE_BUILD)
        LSUIElement: true
        NSHighResolutionCapable: true
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [vignette]
    settings:
      base:
        SWIFT_VERSION: "5.10"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.petepetrash.vignette
        MARKETING_VERSION: "0.1.0"
        # Placeholders: the stamp script below writes the git state into the built Info.plist.
        CURRENT_PROJECT_VERSION: "0"
        VIGNETTE_BUILD: "local"
        # Ad-hoc by default so any clone builds. build.sh overrides the identity and team from the
        # gitignored scripts/signing.env; a real certificate keeps the signature stable across
        # builds, which is what lets Accessibility trust survive a rebuild (see README).
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        # Hardened runtime from the start, so notarizing later is a certificate and not a redesign.
        ENABLE_HARDENED_RUNTIME: true
        # Xcode's Debug builds otherwise put the app in Vignette.debug.dylib for previews, which the
        # hardened runtime refuses to load when the signer has no team ID (a self-signed certificate).
        ENABLE_DEBUG_DYLIB: false
        # No sandbox: the app writes Apple's com.apple.screencapture defaults, watches a folder the
        # user names without security-scoped bookmarks, and installs global event monitors.
        ENABLE_APP_SANDBOX: false
    postBuildScripts:
      # The bundle carries the git state: commit count as CFBundleVersion, describe as
      # VignetteBuild. A build phase, not a build.sh argument, so a build from Xcode or a bare
      # xcodebuild is stamped the same way. Run script phases precede code signing.
      - name: Stamp git state
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT"
          number=$(git rev-list --count HEAD 2>/dev/null || echo 0)
          build=$(git describe --always --dirty 2>/dev/null || echo local)
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $number" -c "Set :VignetteBuild $build" "$plist"
  VignetteTests:
    type: bundle.unit-test
    platform: macOS
    # Compiles the app sources into the test bundle instead of loading the app as a test host,
    # so a test run never launches a second Vignette against the real settings and watch folder.
    sources:
      - path: Tests
      - path: Sources
        excludes: [AppDelegate.swift]
      # The render test loads the built page over the loopback server, as the app does.
      - path: web/dist
        type: folder
        buildPhase: resources
    settings:
      base:
        SWIFT_VERSION: "5.10"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.petepetrash.vignette.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
schemes:
  Vignette:
    build:
      targets:
        Vignette: all
        VignetteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [VignetteTests]
      # A test that reaches Settings.shared bootstraps it, and a bootstrap fills in any keys the
      # file lacks. Without this the file it fills in is the user's own, so a test run rewrites it
      # the moment a build adds a tweak.
      environmentVariables:
        VIGNETTE_SETTINGS: /tmp/vignette-tests/settings.json
