<!doctype html>
<!-- The source of site/og.png, the link preview. It is the page's closer: the fan of cards from the
     demos, drawn by the page's own code, and the headline, on the dark sheet. To render it, serve
     site/ (python3 -m http.server 4719 --directory site), open http://127.0.0.1:4719/og/ in dark mode
     at 1200 by 630 points and 2x, and capture the page. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Vignette share image</title>
<link rel="stylesheet" href="../demo/site.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  .og { width: 1200px; height: 630px; padding: 14px; box-sizing: border-box; }
  .og .sheet {
    --r: 44px;
    --sheet-r: 44px;
    min-height: 0;
    height: 100%;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: 500px 1fr;
    align-items: center;
    padding: 0 0 0 76px;
  }
  .words img { display: block; height: 62px; width: auto; }
  .words h1 {
    margin: 30px 0 0;
    font-size: 50px;
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1.04;
    text-wrap: balance;
  }
  .words p { margin: 22px 0 0; color: var(--ink-2); font-size: 22px; }
  .og .fan { height: 420px; margin: -96px 0 0 -10px; --spread: 10deg; }
  .og .fan-card { width: 236px; bottom: 58px; }
  .og .fan-icon { width: 132px; }
</style>
</head>
<body>
<div class="og">
  <div class="sheet">
    <div class="words">
      <img src="../logotype.svg" alt="Vignette">
      <h1>A picture is worth a thousand‑word prompt.</h1>
      <p>Free and open source, for macOS</p>
    </div>
    <div class="fan" id="fan">
      <img class="fan-icon" src="../demo/app-icon-large.png" alt="">
    </div>
  </div>
</div>
<script type="module">
  import { buildFan } from "../demo/cards.js";
  buildFan(document.getElementById("fan"));
</script>
</body>
</html>
