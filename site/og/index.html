<!doctype html>
<!-- The source of site/og.png, the link preview. It is the page's closer: the wordmark, the headline
     and the tagline above the fan of cards from the demos, drawn by the page's own code, on the dark
     sheet. To render it, serve
     site/ (python3 -m http.server 4719 --directory site), open http://127.0.0.1:4719/og/ in dark mode
     at 1200 by 630 points and 2x, and capture the page. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Vignette share image</title>
<link rel="stylesheet" href="../demo/site.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  .og { width: 1200px; height: 630px; padding: 14px; box-sizing: border-box; }
  .og .sheet { --r: 44px; --sheet-r: 44px; position: relative; min-height: 0; height: 100%; box-sizing: border-box; text-align: center; }
  .words { position: absolute; left: 0; right: 0; top: 46px; }
  .words img { display: block; height: 52px; width: auto; margin: 0 auto; }
  .words h1 { margin: 22px 0 0; font-size: 92px; font-weight: 700; letter-spacing: -0.045em; line-height: 1; }
  .words p { margin: 14px 0 0; color: var(--ink-2); font-size: 23px; letter-spacing: -0.01em; }
  /* The fan rises from the sheet's bottom edge, which crops it, as on the page's closer. */
  .og .fan { position: absolute; left: 50%; bottom: -190px; width: 1100px; height: 620px; margin-left: -550px; --spread: 11deg; }
  .og .fan-card { width: 370px; bottom: 230px; }
  .og .fan-icon { width: 220px; bottom: 180px; }
</style>
</head>
<body>
<div class="og">
  <div class="sheet">
    <div class="words">
      <img src="../logotype.svg" alt="Vignette">
      <h1>Show, don’t prompt.</h1>
      <p>The agent-native screenshot tool for macOS</p>
    </div>
    <div class="fan" id="fan">
      <img class="fan-icon" src="../demo/app-icon-large.png" alt="">
    </div>
  </div>
</div>
<script type="module">
  import { buildFan } from "../demo/cards.js";
  buildFan(document.getElementById("fan"));
</script>
</body>
</html>
